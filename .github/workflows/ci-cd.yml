name: MALA Platform CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Build Backend
  # -------------------------------------------------------------
  backend-test-and-build:
    name: Backend CI (NestJS & Prisma)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: mala_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Backend Dependencies
        working-directory: ./server
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate Prisma Client
        working-directory: ./server
        run: pnpm prisma:generate

      - name: Run Backend Unit Tests
        working-directory: ./server
        run: pnpm test

      - name: Run Backend E2E Tests
        working-directory: ./server
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/mala_test_db?schema=public"
          JWT_SECRET: "ci-test-jwt-secret-key-108"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret-key-108"
        run: pnpm test:e2e

      - name: Compile Backend Production Build
        working-directory: ./server
        run: pnpm build

  # -------------------------------------------------------------
  # Job 2: Typecheck & Build Web Frontend
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend CI (Expo Web & Native TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: pnpm install --frozen-lockfile || pnpm install

      - name: TypeScript Typecheck
        working-directory: ./client
        run: pnpm exec tsc --noEmit

      - name: Build Static Production Web App
        working-directory: ./client
        env:
          EXPO_PUBLIC_API_URL: "https://api.mala.app/api/v1"
          EXPO_PUBLIC_SOCKET_URL: "https://api.mala.app"
        run: pnpm exec expo export --platform web

  # -------------------------------------------------------------
  # Job 3: Build Docker Containers
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Build Validation
    needs: [backend-test-and-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: mala-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: mala-frontend:latest

